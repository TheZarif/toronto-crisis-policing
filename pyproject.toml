[project]
name = "toronto-crisis-policing"
version = "1.0.0"
description = "Code and data for \"Crisis Policing in Toronto's Neighbourhoods\": Mental Health Act apprehensions and race-based arrest data"
authors = [{ name = "Zarif Masud", email = "zarif.masud@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars",
    "pandas",
    "pyarrow",
    "numpy",
    "geopandas",
    "pyogrio",
    "plotnine",
    "mizani",
    "statsmodels",
    "scipy",
    "requests",
    "jupyter",
    "ipykernel",
    "fastexcel>=0.21.0",
    "great-tables>=1.0.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["table_checks", "figure_style"]
